_min_copier_version: "9.0.0"
_subdirectory: "copier-template"
_templates_suffix: ".jinja"
_answers_file: ".copier-answers.yml"

repo_name:
  type: str
  help: "Repository name (directory and package name)"

command_name:
  type: str
  default: "{{ repo_name }}"
  help: "Primary extension command name"

github_maintainer:
  type: str
  default: "tryingET"
  help: "GitHub handle to seed in .github/VOUCHED.td"

intake_profile:
  type: str
  choices:
    - guided
    - minimal
  default: guided
  help: "Startup intake question profile (guided includes decision cards + recommendations)"

interview_tool_source:
  type: str
  default: "git:github.com/ghoseb/pi-askuserquestion@e6e8e20b4fa195b11d6f8007d74530374271c254"
  help: "Pinned interview tool source (pi-askuserquestion) — pinned to verified commit"

project_context:
  type: str
  default: ""
  help: "Optional startup intake context seed (short summary of project/domain intent)"

_tasks:
  - "chmod +x scripts/sync-to-live.sh scripts/install-hooks.sh scripts/init-project-docs.sh scripts/build-intake-questions-runtime.mjs scripts/docs-list.sh scripts/release-check.sh scripts/validate-structure.sh scripts/quality-gate.sh .githooks/pre-commit .githooks/pre-push"
  - "git init -q"
  - "bash ./scripts/install-hooks.sh"

_message_after_copy: |
  Scaffold created at {{ _copier_conf.dst_path }}

  Next:
    cd {{ _copier_conf.dst_path }}
    npm install
    npm run docs:list
    npm run check

  Startup interview flow:
    - Open the repo in pi
    - Send your startup intent as first non-command message
    - Router proposes: /init-project-docs "<intent>"
    - Runtime questions adapt from README/package/folder{% if project_context %} + project_context seed{% endif %}

  Copier policy:
    - Commit .copier-answers.yml
    - Do not edit it manually
    - Run update/recopy from a clean destination repo (commit or stash pending changes first)
    - Use `copier update --trust` when `.copier-answers.yml` includes `_commit` and update is supported
    - In non-interactive shells/CI, append `--defaults` to update/recopy
    - Use `copier recopy --trust` when update is unavailable (e.g. local non-VCS source) or cannot reconcile cleanly
