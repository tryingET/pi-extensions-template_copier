name: template-guardrails

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce template-source invariants
        shell: bash
        run: bash ./scripts/template-guardrails.sh

  smoke-test:
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install copier
        shell: bash
        run: python -m pip install --upgrade pip copier

      - name: Generate and validate smoke repo
        shell: bash
        run: bash ./scripts/smoke-test-template.sh

  generated-contract:
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install copier
        shell: bash
        run: python -m pip install --upgrade pip copier

      - name: Verify generated include/exclude contract
        shell: bash
        run: bash ./scripts/generated-contract-test.sh
